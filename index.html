<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albert Escrichs — Portfolio Creativo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- pdf.js: solo para el editor (convierte PDF en imágenes). No se incluye en el export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- ═══════════ CSS DEL SITIO (se exporta) ═══════════ -->
<style id="site-css">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{--pk:#e0007f;--pkl:color-mix(in srgb,var(--pk) 8%,transparent);--pkm:color-mix(in srgb,var(--pk) 18%,transparent);--dk:#0d0d0d;--mid:#444;--gr:#888;--gr2:#bbb;--bd:#e8e8e8;--bg:#f5f5f5;--wh:#fff;--fs-hero:clamp(48px,8vw,108px);--fs-h2:clamp(28px,4vw,52px)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--dk);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit}
section{scroll-margin-top:64px}
:focus-visible{outline:2px solid var(--pk);outline-offset:3px;border-radius:3px}
svg{flex-shrink:0}
#pb{position:fixed;top:0;left:0;height:2px;background:var(--pk);z-index:600;width:0;pointer-events:none}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:500;height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:transparent;border-bottom:1px solid transparent;transition:background .35s,border-color .35s}
.nav.sc{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-color:var(--bd)}
.nav-id{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--bd);background:#eee;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--pk)}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
.nav-name{font-size:13px;font-weight:800;letter-spacing:-.3px}
.nav-links{display:flex;gap:28px}
.nav-links a{font-size:12px;font-weight:600;color:var(--gr);position:relative;transition:color .2s}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1.5px;background:var(--pk);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a:hover,.nav-links a.ac{color:var(--dk)}
.nav-links a:hover::after,.nav-links a.ac::after{transform:scaleX(1)}
.nav-cta{display:flex;gap:8px}
.nav-mb{display:none;background:none;border:0;cursor:pointer;padding:4px;color:var(--mid)}
.nav-mb svg{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid transparent;letter-spacing:.2px;transition:transform .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-pk{background:var(--pk);color:#fff}
.btn-pk:hover{transform:translateY(-1px);box-shadow:0 6px 24px color-mix(in srgb,var(--pk) 38%,transparent)}
.btn-gh{background:transparent;color:var(--dk);border-color:var(--bd)}
.btn-gh:hover{border-color:var(--pk);color:var(--pk);transform:translateY(-1px)}
.btn-wh{background:#fff;color:var(--dk)}
.btn-wh:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.mnav{position:fixed;inset:0;background:#fff;z-index:800;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;transform:translateY(-100%);transition:transform .5s cubic-bezier(.77,0,.175,1)}
.mnav.on{transform:none}
.mnav>a:not(.btn){font-size:32px;font-weight:900;letter-spacing:-1px;padding:8px 0;transition:color .2s}
.mnav>a:not(.btn):hover{color:var(--pk)}
.mnav-close{position:absolute;top:18px;right:20px;background:none;border:0;cursor:pointer;color:var(--gr)}
.mnav-close svg{width:26px;height:26px}
.mnav-cta{display:flex;gap:8px;margin-top:20px}
#st{position:fixed;bottom:84px;right:24px;z-index:200;width:44px;height:44px;border-radius:50%;background:var(--dk);color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .3s,transform .3s,background .2s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
#st svg{width:18px;height:18px}
#st.on{opacity:1;pointer-events:auto;transform:none}
#st:hover{background:var(--pk)}

/* HERO */
#top{background:var(--wh);min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:110px 40px 90px;border-bottom:1px solid var(--bd);position:relative;overflow:hidden}
.hero-inner{max-width:1100px;margin:0 auto;width:100%}
.hero-avail{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:100px;padding:6px 16px 6px 10px;font-size:11px;font-weight:600;color:var(--mid);margin-bottom:32px;background:var(--wh)}
.avail-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.hero-h{font-size:var(--fs-hero);font-weight:900;line-height:.92;letter-spacing:-.04em;margin-bottom:40px}
.hl{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.hl>span{display:inline-block}
.hl:last-child{color:var(--pk)}
.hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}
.hero-desc{font-size:15px;color:var(--mid);line-height:1.8;border-left:2px solid var(--pk);padding-left:18px}
.hero-desc strong{color:var(--dk)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.hero-badge-float{position:absolute;top:120px;right:60px;background:var(--wh);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.08);text-align:center}
.hbf-n{font-size:36px;font-weight:900;color:var(--pk);letter-spacing:-2px;line-height:1}
.hbf-l{font-size:10px;color:var(--gr);font-weight:500;white-space:nowrap}
.hero-scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gr2)}
.scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--pk),transparent);animation:sl 1.8s ease-in-out infinite}
@keyframes sl{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* MARQUEE */
.marquee{background:var(--dk);padding:16px 0;overflow:hidden}
.mq-track{display:flex;width:max-content;animation:mq 26s linear infinite}
.mq-item{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);padding:0 32px;display:flex;align-items:center;gap:32px;white-space:nowrap}
.mq-item span{color:var(--pk)}
@keyframes mq{to{transform:translateX(-50%)}}

/* SECTION HEAD */
.sec-head{padding:0 40px;max-width:1180px;margin:0 auto 36px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.sec-ey{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--pk);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-ey::before{content:'';width:20px;height:1.5px;background:var(--pk)}
.sec-t{font-size:var(--fs-h2);font-weight:900;letter-spacing:-.035em;line-height:1}
.arrows{display:flex;gap:8px}
.arrows .btn{padding:10px 14px}

/* WORK */
#work{background:var(--wh);padding:80px 0 56px;border-bottom:1px solid var(--bd)}
.filters{display:flex;flex-wrap:wrap;gap:8px;max-width:1180px;margin:0 auto 28px;padding:0 40px}
.chip{border:1.5px solid var(--bd);background:var(--wh);border-radius:100px;padding:6px 16px;font-size:11px;font-weight:600;color:var(--mid);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--pk);color:var(--pk)}
.chip.active{background:var(--pk);border-color:var(--pk);color:#fff}
.h-scroll{padding:6px 40px 12px;overflow-x:auto;scrollbar-width:none;cursor:grab;user-select:none}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll.grabbing{cursor:grabbing}
.h-scroll-inner{display:flex;gap:20px;width:max-content}
.pc{position:relative;width:380px;flex:none;border-radius:16px;overflow:hidden;background:var(--wh);border:1.5px solid var(--bd);cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s,border-color .35s}
.pc:hover{transform:translateY(-8px);box-shadow:0 20px 60px rgba(0,0,0,.12);border-color:var(--pk)}
.pc.is-hidden{display:none}
.pc-img{height:240px;background:linear-gradient(135deg,#f0f0f0,#e0e0e0);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pc-img img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:#bbb;font-size:10px}
.ph svg{width:40px;height:40px;opacity:.35}
.pc-hover{position:absolute;inset:0;background:color-mix(in srgb,var(--pk) 90%,transparent);opacity:0;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.pc:hover .pc-hover{opacity:1}
.pc-hover span{color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.pc-hover svg{width:16px;height:16px}
.pc-count{position:absolute;right:10px;bottom:10px;background:rgba(13,13,13,.78);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:100px}
.pc-body{padding:20px 22px}
.pc-cat{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--pk);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.pc-cat::before{content:'';width:14px;height:1.5px;background:var(--pk)}
.pc-t{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;line-height:1.25}
.pc-ex{font-size:11.5px;color:var(--gr);line-height:1.6;margin-bottom:14px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-tags{display:flex;flex-wrap:wrap;gap:4px}
.pc-year{font-size:10px;font-weight:700;color:var(--gr2);white-space:nowrap}
.tag{display:inline-block;font-size:9.5px;font-weight:600;color:var(--mid);background:var(--bg);border:1px solid var(--bd);border-radius:100px;padding:2px 9px;transition:all .2s}
.tag:hover{background:var(--pkl);color:var(--pk);border-color:var(--pk)}
.scroll-hint{max-width:1180px;margin:18px auto 0;padding:0 40px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;color:var(--gr2);letter-spacing:.5px}
.scroll-hint svg{width:14px;height:14px}

/* ABOUT */
#about{background:var(--wh);padding:100px 40px;border-bottom:1px solid var(--bd)}
.about-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:440px 1fr;gap:80px;align-items:start}
.about-photo{border-radius:20px;overflow:hidden;background:#e8e8e8;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;position:relative}
.about-photo>img{width:100%;height:100%;object-fit:cover}
.about-photo-badge{position:absolute;bottom:20px;left:20px;background:var(--wh);border-radius:12px;padding:12px 18px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.apb-n{font-size:20px;font-weight:900;color:var(--pk);letter-spacing:-1px}
.apb-l{font-size:10px;color:var(--gr)}
.about-role{font-size:13px;font-weight:700;color:var(--pk);margin-bottom:6px}
.about-name{font-size:clamp(36px,5vw,56px);font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:24px}
.about-bio{font-size:14px;color:var(--mid);line-height:1.85;margin-bottom:32px}
.about-bio p{margin-bottom:14px}
.about-bio strong{color:var(--dk)}
.sub-h{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gr);margin-bottom:16px}
.wh-item{position:relative;display:grid;grid-template-columns:1fr 1.2fr 100px;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);align-items:center}
.wh-item:last-child{border-bottom:0}
.wh-co{font-size:13px;font-weight:800}
.wh-role{font-size:11px;color:var(--pk);font-weight:600}
.wh-date{font-size:10px;color:var(--gr);text-align:right}
.wh-extra{display:none}.wh-extra.show{display:grid}
.wh-show{margin-top:12px;font-size:11px;font-weight:700;color:var(--gr);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .2s}
.wh-show:hover{color:var(--pk)}
.wh-show svg{width:12px;height:12px}
.stack-list{display:flex;flex-wrap:wrap;gap:8px}
.stack-item{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--mid);transition:all .2s}
.stack-item:hover{border-color:var(--pk);color:var(--pk);background:var(--pkl)}

/* SERVICES */
#services{background:var(--bg);padding:100px 40px;border-bottom:1px solid var(--bd)}
.services-inner{max-width:1100px;margin:0 auto}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.svc-card{position:relative;background:var(--wh);border:1.5px solid var(--bd);border-radius:16px;padding:28px 24px;overflow:hidden;transition:border-color .25s,box-shadow .25s,transform .25s}
.svc-card:hover{border-color:var(--pk);box-shadow:0 8px 32px var(--pkm);transform:translateY(-4px)}
.svc-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--pk);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.svc-card:hover::after{transform:scaleX(1)}
.svc-num{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--pk);margin-bottom:16px}
.svc-icon{width:44px;height:44px;background:var(--pkl);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--pk)}
.svc-icon svg{width:22px;height:22px}
.svc-t{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
.svc-d{font-size:12px;color:var(--gr);line-height:1.7}
.svc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.svc-cta{background:var(--dk);border-color:var(--dk)}
.svc-cta .svc-num{color:rgba(255,255,255,.35)}
.svc-cta .svc-icon{background:rgba(255,255,255,.08);color:#fff}
.svc-cta .svc-t{color:#fff}
.svc-cta .svc-d{color:rgba(255,255,255,.5)}
.svc-cta-link{display:inline-block;margin-top:16px;font-size:11px;font-weight:700;color:var(--pk)}

/* TESTIMONIALS */
#testimonials{background:var(--wh);padding:80px 0;border-bottom:1px solid var(--bd);overflow:hidden}
.test-head{padding:0 40px;max-width:1180px;margin:0 auto 44px}
.test-wrap{overflow:hidden}
.test-track{display:flex;gap:16px;width:max-content;animation:tm 40s linear infinite}
.test-track:hover{animation-play-state:paused}
@keyframes tm{to{transform:translateX(-50%)}}
.test-card{position:relative;flex:none;width:340px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:24px}
.test-quote{font-size:13px;color:var(--mid);line-height:1.7;margin-bottom:20px}
.test-quote strong{color:var(--dk)}
.test-author{display:flex;align-items:center;gap:10px}
.test-av{width:36px;height:36px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--pk)}
.test-name{font-size:12px;font-weight:700}
.test-role{font-size:10px;color:var(--gr)}
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:0 40px;max-width:1180px;margin:0 auto}
.test-grid .test-card{width:auto}

/* FAQ */
#faq{background:var(--bg);padding:100px 40px;border-bottom:1px solid var(--bd)}
.faq-inner{max-width:800px;margin:0 auto}
.faq-list{margin-top:44px}
.faq-item{position:relative;border-bottom:1px solid var(--bd)}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;font-size:15px;font-weight:700;cursor:pointer;transition:color .2s}
.faq-q:hover{color:var(--pk)}
.faq-ic{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,border-color .2s,transform .3s;color:var(--mid)}
.faq-ic svg{width:14px;height:14px}
.faq-item.open .faq-ic{background:var(--pk);border-color:var(--pk);transform:rotate(45deg);color:#fff}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.faq-item.open .faq-a{max-height:600px}
.faq-a-in{font-size:13px;color:var(--gr);line-height:1.8;padding-bottom:20px}

/* CTA */
#cta{background:var(--dk);padding:120px 40px;position:relative;overflow:hidden}
#cta::before{content:'';position:absolute;top:-80px;right:-80px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pk) 14%,transparent) 0%,transparent 70%);animation:pls 5s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.1)}}
.cta-inner{max-width:1100px;margin:0 auto;text-align:center;position:relative;z-index:1}
.cta-ey{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--pk);display:inline-flex;align-items:center;gap:8px;margin-bottom:20px}
.cta-h{font-size:var(--fs-hero);font-weight:900;letter-spacing:-.04em;line-height:.92;color:#fff;margin-bottom:40px}
.cl{display:block;overflow:hidden;padding-bottom:.06em}
.cl>span{display:inline-block}
.cl.acc{color:var(--pk)}
.cta-sub{font-size:15px;color:rgba(255,255,255,.45);max-width:480px;margin:0 auto 40px;line-height:1.7}
.cta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta-btns .btn{font-size:13px;padding:14px 28px}

/* FOOTER */
footer{background:var(--dk);border-top:1px solid rgba(255,255,255,.06);padding:60px 40px 40px;overflow:hidden}
.ft-inner{max-width:1100px;margin:0 auto}
.ft-big{font-size:clamp(44px,10vw,140px);font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:40px;color:#fff}
.ft-sep{color:rgba(255,255,255,.12);margin:0 12px}
.ft-tail{color:var(--pk)}
.ft-contact{display:flex;gap:32px;margin-bottom:40px;flex-wrap:wrap}
.ft-ct-l{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:4px}
.ft-ct-v{font-size:14px;font-weight:700;color:#fff}
.ft-ct-v a{transition:color .2s}.ft-ct-v a:hover{color:var(--pk)}
.ft-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);padding-top:28px}
/* Logo versión negativa: siempre monocromo blanco */
.ft-logo{font-size:14px;font-weight:900;letter-spacing:-.3px;color:#fff}
.ft-links{display:flex;gap:24px}
.ft-links a{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);transition:color .2s}
.ft-links a:hover{color:var(--pk)}
.ft-copy{font-size:10px;color:rgba(255,255,255,.22)}

/* DETAIL MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-ov.on{opacity:1;pointer-events:auto}
.modal{background:var(--wh);border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;position:relative;transform:scale(.96) translateY(16px);transition:transform .35s cubic-bezier(.175,.885,.32,1.275)}
.modal-ov.on .modal{transform:none}
.modal-close{position:sticky;top:12px;float:right;margin:12px 12px -48px 0;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dk);box-shadow:0 2px 10px rgba(0,0,0,.15);transition:background .2s,color .2s}
.modal-close:hover{background:var(--pk);color:#fff}
.modal-close svg{width:16px;height:16px}

/* ---------- ANIMACIONES ---------- */
function animate(){
 try{
  if(window.ScrollTrigger)ScrollTrigger.getAll().forEach(function(t){t.kill()});
  if(ED||!window.gsap||!window.ScrollTrigger)return;
  gsap.registerPlugin(ScrollTrigger);
  var tl=gsap.timeline({defaults:{ease:'power4.out'}});
  tl.from('.hero-avail',{opacity:0,y:12,duration:.7,delay:.15})
    .from('.hl>span',{yPercent:110,duration:1,stagger:.12,ease:'expo.out'},'<.1')
    .from('.hero-bottom',{opacity:0,y:20,duration:.8},'<.4')
    .from('.hero-badge-float',{opacity:0,y:-16,duration:.9,ease:'back.out(1.5)'},'<.2')
    .from('.hero-scroll',{opacity:0,duration:.6},'<.3');
  gsap.utils.toArray('.rv').forEach(function(el){gsap.from(el,{opacity:0,y:28,duration:.75,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 88%',once:true}})});
  gsap.utils.toArray('.pc').forEach(function(c,i){gsap.from(c,{opacity:0,y:32,duration:.7,ease:'power3.out',delay:i*.06,scrollTrigger:{trigger:'#hscroll',start:'top 90%',once:true}})});
  gsap.utils.toArray('.svc-card').forEach(function(c,i){gsap.from(c,{opacity:0,y:28,duration:.65,ease:'power3.out',delay:(i%3)*.08,scrollTrigger:{trigger:c,start:'top 90%',once:true}})});
  gsap.utils.toArray('.faq-item').forEach(function(c,i){gsap.from(c,{opacity:0,y:16,duration:.6,ease:'power3.out',delay:i*.05,scrollTrigger:{trigger:c,start:'top 92%',once:true}})});
  if($('#cta'))gsap.from('.cl>span',{yPercent:110,duration:1,stagger:.1,ease:'expo.out',scrollTrigger:{trigger:'#cta',start:'top 70%',once:true}});
 }catch(e){if(window.console)console.warn(e)}
}
function startWords(){

/* ---------- EVENTOS (delegados, una sola vez) ---------- */
function bindOnce(){
 if(bound)return;bound=true;
 document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('#scrollR')){$('#hscroll').scrollBy({left:400,behavior:'smooth'});return}
  if(t.closest('#scrollL')){$('#hscroll').scrollBy({left:-400,behavior:'smooth'});return}
  var chip=t.closest('.chip');
  if(chip){$$('.chip').forEach(function(c){c.classList.toggle('active',c===chip)});var f=chip.dataset.filter;$$('.pc').forEach(function(c){c.classList.toggle('is-hidden',f!=='*'&&c.dataset.cat!==f)});return}
  if(ED)return;
  if(t.closest('#mBtn')){$('#mnav').classList.add('on');return}
  if(t.closest('#mClose')||t.closest('#mnav a'))$('#mnav').classList.remove('on');
  var a=t.closest('a[href^="#"]');
  if(a&&a.getAttribute('href').length>1){var el=$(a.getAttribute('href'));if(el){e.preventDefault();window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60,behavior:'smooth'})}}
  if(t.closest('#st')||t.closest('#navTop'))window.scrollTo({top:0,behavior:'smooth'});
  var pc=t.closest('.pc');if(pc&&!dragged){openDetail(+pc.dataset.item.split('.')[1]);return}
  var fq=t.closest('.faq-q');
  if(fq){var it=fq.parentNode,was=it.classList.contains('open');$$('.faq-item').forEach(function(x){x.classList.remove('open')});if(!was)it.classList.add('open')}
  if(t.closest('#whToggle')){var open=$('.wh-extra.show');$$('.wh-extra').forEach(function(x){x.classList.toggle('show',!open)});var s=$('#whToggle span');if(s)s.textContent=open?'Ver toda la experiencia':'Ver menos'}
  if(t.closest('#mdClose')||t.id==='mOv')closeDetail();
  var g=t.closest('[data-gal]');if(g)galGo(+g.dataset.gal);
  var dot=t.closest('.gal-dots i');if(dot)galGo(0,+dot.dataset.k);
 });
 document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeDetail();
  if($('#mOv')&&$('#mOv').classList.contains('on')){if(e.key==='ArrowRight')galGo(1);if(e.key==='ArrowLeft')galGo(-1)}
  if((e.key==='Enter')&&!ED&&e.target.classList&&e.target.classList.contains('pc'))openDetail(+e.target.dataset.item.split('.')[1]);
 });
 document.addEventListener('mousedown',function(e){var hs=e.target.closest&&e.target.closest('#hscroll');if(!hs||ED)return;drag={x:e.pageX,l:hs.scrollLeft,hs:hs};dragged=false});
 document.addEventListener('mousemove',function(e){if(!drag)return;var dx=e.pageX-drag.x;if(Math.abs(dx)>4){dragged=true;drag.hs.classList.add('grabbing')}if(dragged)drag.hs.scrollLeft=drag.l-dx*1.2});
 document.addEventListener('mouseup',function(){if(drag){drag.hs.classList.remove('grabbing');drag=null;setTimeout(function(){dragged=false},0)}});
 window.addEventListener('scroll',function(){
  var nav=$('#nav');if(!nav)return;
  var y=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
  nav.classList.toggle('sc',y>60);
  var pb=$('#pb');if(pb)pb.style.width=(h>0?y/h*100:0)+'%';
  var st=$('#st');if(st)st.classList.toggle('on',y>500);
  ['work','about','services','faq'].forEach(function(id){var el=document.getElementById(id);if(!el)return;var r=el.getBoundingClientRect(),a=$('.nav-links a[href="#'+id+'"]');if(a)a.classList.toggle('ac',r.top<=100&&r.bottom>100)});
 },{passive:true});
}

}

 box.onclick=function(e){
  var b=e.target.closest('button');if(!b)return;var k=+b.closest('.ed-im').dataset.k,a=b.dataset.a,im=p.images;
  if(a==='x')im.splice(k,1);
  else if(a==='s'&&k>0){var x=im.splice(k,1)[0];im.unshift(x)}
  else if(a==='l'&&k>0){var t=im[k-1];im[k-1]=im[k];im[k]=t}
  else if(a==='r'&&k<im.length-1){var t2=im[k+1];im[k+1]=im[k];im[k]=t2}
  draw();
 };
 $('#pFile').onchange=async function(e){
  var files=Array.prototype.slice.call(e.target.files);note('Procesando '+files.length+' archivo(s)…');
  for(var n=0;n<files.length;n++){var f=files[n];
   try{if(f.type==='application/pdf'){var pg=await pdfToImages(f);pg.forEach(function(x){p.images.push(x)})}else p.images.push(await readImage(f,1400))}
   catch(err){note('No se pudo procesar «'+f.name+'»'+(f.type==='application/pdf'?'. Prueba a exportar sus páginas como imágenes.':'.'))}
  }
  e.target.value='';draw();
 };
 $('#pImgAdd').onclick=function(){var u=$('#pImgUrl').value.trim();if(!u)return;if(/^\s*(javascript|vbscript):/i.test(u)){note('URL no válida');return}p.images.push(u);$('#pImgUrl').value='';draw()};
 function vnote(t){$('#pVidNote').textContent=t||''}
 $('#pVid').oninput=function(){pv.src=this.value.trim();vnote('')};
 $('#pVidClr').onclick=function(){pv.src='';$('#pVid').value='';vnote('')};
 $('#pVidFile').onchange=async function(e){
  var f=e.target.files[0];if(!f)return;vnote('Procesando…');
  try{var r=await videoFromFile(f);pv.src=r.src;$('#pVid').value=r.embedded?'':r.src;vnote(r.embedded?'Vídeo incrustado en la web.':'Vídeo local: sube el archivo a «'+r.name+'» en tu repositorio para que se vea al publicar.')}catch(err){vnote('No se pudo procesar el vídeo')}
  e.target.value='';
 };
 $('#pPosFile').onchange=async function(e){var f=e.target.files[0];if(!f)return;try{pv.poster=await readImage(f,1400);vnote('Portada del vídeo añadida.')}catch(err){vnote('No se pudo leer la imagen')}e.target.value=''};
 $('#pX').onclick=$('#pCancel').onclick=function(){if(isNew)STATE.projects.splice(i,1);closeDlg();rerender()};
 $('#pDel').onclick=function(){snap();STATE.projects.splice(i,1);closeDlg();commit()};
 $('#pSave').onclick=function(){
  p.cat=$('#pCat').value.trim()||'Sin categoría';p.title=$('#pTitle').value.trim()||'Sin título';p.excerpt=$('#pEx').value.trim();p.desc=$('#pDesc').value.trim();
  p.tags=$('#pTags').value.split(',').map(function(s){return s.trim()}).filter(Boolean);p.year=$('#pYear').value.trim();p.client=$('#pClient').value.trim();p.url=$('#pUrl').value.trim();p.draft=$('#pDraft').checked;
  if(pv.src){p.video={src:pv.src,poster:pv.poster||'',autoplay:$('#pVAuto').checked,loop:$('#pVLoop').checked,cine:$('#pVCine').checked}}else delete p.video;
  snap();STATE.projects[i]=p;closeDlg();commit();toast('Proyecto guardado');
 };
}

/* ----- exportación con lista de archivos de vídeo (sustituye a openExport) ----- */
function openExport(){
 var html=buildExport(),mb=(html.length/1048576).toFixed(2),media=mediaNeeded();
 $('#edDlg').innerHTML='<div class="ed-ov"><div class="ed-dlg"><div class="ed-dr-h"><b>Exportar para GitHub</b><button class="ed-x" id="xClose">✕</button></div><div class="ed-dr-b"><p class="ed-note">Archivo único y autocontenido (imágenes incluidas) · <b>'+mb+' MB</b>'+(mb>5?' · pesado: reduce el número de imágenes':'')+'</p>'
 +(media.length?'<p class="ed-note" style="background:#fff5fa;border:1px solid #f4c3dc;border-radius:10px;padding:10px 12px;color:#0d0d0d"><b>Archivos de vídeo que debes subir a tu repositorio:</b><br>'+media.map(function(m){return '<code>'+esc(m)+'</code>'}).join('<br>')+'<br><span style="color:#777">Crea la carpeta <code>media/</code> junto a <code>index.html</code> y sube ahí los MP4 con exactamente estos nombres.</span></p>':'')
 +'<ol class="ed-steps"><li>Pulsa <b>Descargar index.html</b> (o copia el código de abajo).</li><li>En GitHub: tu repositorio → <b>Add file → Upload files</b> → sube <code>index.html</code>'+(media.length?' y la carpeta <code>media/</code>':'')+'.</li><li><b>Settings → Pages</b> → Branch <code>main</code> / root. En 1-2 minutos estará online.</li></ol><textarea id="xTxt" readonly rows="8"></textarea></div>'
 +'<div class="ed-dr-f"><button class="ed-b2" id="xCopy">Copiar código</button><span style="flex:1"></span><button class="ed-b ed-b-pk" id="xDl">Descargar index.html</button></div></div></div>';
 $('#xTxt').value=html;
 $('#xClose').onclick=closeDlg;
 $('#xDl').onclick=function(){if(downloadFile('index.html',html,'text/html'))toast('Descarga iniciada');else{$('#xTxt').select();toast('Descarga bloqueada: copia el código con Ctrl+C')}};
 $('#xCopy').onclick=function(){
  var ok=function(){toast('Código copiado')},ko=function(){$('#xTxt').select();try{document.execCommand('copy');ok()}catch(e){toast('Selecciona el texto y pulsa Ctrl+C')}};
  try{navigator.clipboard.writeText(html).then(ok,ko)}catch(e){ko()}
 };
}

.st-f input[type=text]:focus,.st-f textarea:focus{outline:0;border-color:#e0007f}`;
 document.head.appendChild(st);
})();

/* ---------- init ---------- */
(async function init(){
 var saved=null;
 try{var r=await window.storage.get('portfolio:data',false);if(r&&r.value)saved=JSON.parse(r.value)}catch(e){}
 if(saved){STATE=merge(DEFAULT,saved)}
 fix();buildUI();
 document.documentElement.classList.add('editing');
 rerender();
 setStatus(saved?'Cargado ✓':'Listo');
 toast('Modo edición: haz clic en cualquier texto para editarlo');
})();
})();
